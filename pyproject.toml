[project]
name = "llmwiki-engine"
version = "0.2.2"
description = "Lite LLM-Wiki ingest engine with automatic write transactions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
embeddings = [
  "sentence-transformers>=5.0",
]

[project.scripts]
llmwiki = "llmwiki_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
