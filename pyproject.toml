[project]
name = "llmwiki-engine"
version = "0.1.0"
description = "A modular knowledge-compilation engine for LLM-Wiki style vaults."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
embedding = [
  "sentence-transformers>=3.0",
]

[project.scripts]
llmwiki = "llmwiki_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmwiki_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
