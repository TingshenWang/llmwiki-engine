name: project_basic
version: "1"
description: Minimal project-oriented wiki profile.
default_page_type: concept
source_page_type: source
page_types:
  source:
    directory: sources
    title_prefix: "Source_"
    template: source.md
    required_sections: ["Summary", "Source Info", "Claims"]
    evidence_policy: strict
  concept:
    directory: concepts
    title_prefix: "Concept_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: strict
  entity:
    directory: entities
    title_prefix: "Entity_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: light
  comparison:
    directory: comparisons
    title_prefix: "Comparison_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: light
  overview:
    directory: overviews
    title_prefix: "Overview_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: light
  design:
    directory: designs
    title_prefix: "Design_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: light
  event:
    directory: events
    title_prefix: "Event_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: light

