name: research_basic
version: "1"
description: Research-oriented wiki profile with stricter source provenance.
default_page_type: concept
source_page_type: source
page_types:
  source:
    directory: sources
    title_prefix: "Source_"
    template: source.md
    required_sections: ["Summary", "Source Info", "Claims"]
    evidence_policy: strict
  concept:
    directory: concepts
    title_prefix: "Concept_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: strict
  entity:
    directory: entities
    title_prefix: "Entity_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: strict
  overview:
    directory: overviews
    title_prefix: "Overview_"
    template: concept.md
    required_sections: ["Summary", "Claims"]
    evidence_policy: strict

